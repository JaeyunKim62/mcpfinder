name: Update MCP Server Data

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_full_sync:
        description: 'Force full sync from scratch instead of incremental'
        required: false
        type: boolean
        default: false

concurrency:
  group: sync-mcp-data
  cancel-in-progress: false

jobs:
  sync:
    name: Sync & Update MCP Data
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run data sync (Incremental or Full)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.force_full_sync }}" = "true" ]; then
            npm run sync -- --full
          else
            npm run sync
          fi

      - name: Check for data changes
        id: git_status
        run: |
          git status --porcelain data/servers.json data/sync-state.json
          if [ -n "$(git status --porcelain data/servers.json data/sync-state.json)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push updated data
        if: steps.git_status.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/servers.json data/sync-state.json
          COUNT=$(node -e "try { console.log(require('./data/servers.json').length) } catch(e) { console.log('updated') }")
          git commit -m "chore(data): auto-sync MCP servers [total: ${COUNT}]"
          git push
